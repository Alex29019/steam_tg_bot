<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d18"><title>Steam Account Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#080c16;--panel:#111827;--panel2:#172236;--line:rgba(148,163,184,.15);--text:#eef4ff;--muted:#8fa1ba;--accent:#70a5ff;--accent2:#8b5cf6;--green:#4ade80}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 85% -10%,rgba(80,105,255,.22),transparent 60%),radial-gradient(700px 400px at -10% 20%,rgba(139,92,246,.14),transparent 60%),var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.hero{padding:20px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(31,48,78,.94),rgba(18,25,43,.9));box-shadow:0 18px 55px rgba(0,0,0,.25);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;right:-65px;top:-90px;background:#638dff;filter:blur(75px);opacity:.4}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:#9bb8f5;font-weight:800}.hero h1{font-size:27px;line-height:1.1;margin:8px 0}.hero p{color:#aab8ce;margin:8px 0 0;font-size:13px}.stats{display:flex;gap:10px;margin-top:17px}.stat{padding:9px 12px;background:rgba(5,10,22,.38);border:1px solid var(--line);border-radius:13px;font-size:12px;color:var(--muted)}.stat b{color:white;font-size:16px;margin-right:5px}
.searchbox{display:flex;align-items:center;gap:10px;margin:18px 0 12px;padding:0 15px;height:52px;background:#111a2a;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.15)}.searchbox span{font-size:18px;color:#91a8ca}.searchbox input{width:100%;background:none;border:0;outline:0;color:var(--text);font-size:15px}.searchbox input::placeholder{color:#71829c}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 14px;color:var(--muted);font-size:12px}.toolbar button{border:0;background:none;color:#9fc0ff;font-weight:700;font-size:12px;padding:6px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}.card{background:linear-gradient(145deg,rgba(20,31,50,.98),rgba(14,22,37,.98));border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:0 10px 25px rgba(0,0,0,.16);min-width:0}.cardtop{display:flex;align-items:flex-start;gap:10px;margin-bottom:13px}.gameicon{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(95,145,255,.25),rgba(139,92,246,.2));border:1px solid rgba(137,169,255,.18);font-size:19px}.game{font-weight:750;font-size:15px;line-height:1.3;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:11px;margin-top:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.copy{border:1px solid rgba(112,165,255,.22);border-radius:12px;padding:11px 8px;background:rgba(74,111,180,.12);color:#dce9ff;font-weight:700;font-size:12px;cursor:pointer}.copy:active{transform:scale(.98);background:rgba(74,111,180,.25)}.copy.pass{border-color:rgba(139,92,246,.25);background:rgba(139,92,246,.12)}
.state{padding:34px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.spinner{width:24px;height:24px;border:3px solid #334155;border-top-color:#8bb4ff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#e8f0ff;color:#101827;border-radius:30px;padding:11px 17px;font-weight:750;font-size:13px;box-shadow:0 10px 35px #0008;transition:.22s;z-index:9;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.foot{text-align:center;color:#62728b;font-size:11px;padding:20px 0 4px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:32px}}
</style></head>
<body><main class="wrap">
<section class="hero"><div class="eyebrow">STEAM ACCOUNT HUB</div><h1>Каталог аккаунтов</h1><p>Найди нужную игру и скопируй логин или пароль одним нажатием.</p><div class="stats"><div class="stat"><b id="total">—</b> аккаунтов</div><div class="stat"><b id="shown">—</b> найдено</div></div></section>
<label class="searchbox"><span>⌕</span><input id="search" type="search" placeholder="Поиск по названию игры…" autocomplete="off"></label>
<div class="toolbar"><span id="caption">Загрузка каталога…</span><button id="refresh">↻ Обновить</button></div>
<section id="cards" class="grid"><div class="state"><div class="spinner"></div>Загружаем аккаунты…</div></section>
<div class="foot">Доступ к каталогу подтверждается Telegram</div></main><div class="toast" id="toast">Скопировано</div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
if(tg?.setHeaderColor)tg.setHeaderColor('#090d18');if(tg?.setBackgroundColor)tg.setBackgroundColor('#090d18');
const $=id=>document.getElementById(id);let all=[];let timer;
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),1600)}
async function copyText(value,label){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value)}else{const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copy failed')}toast(label+' скопирован')}catch(e){toast('Не удалось скопировать')}}
function render(list){$('shown').textContent=list.length;$('caption').textContent=list.length?'Аккаунты по играм':'Ничего не найдено';const root=$('cards');root.replaceChildren();if(!list.length){const empty=document.createElement('div');empty.className='state';empty.textContent='По этому запросу аккаунтов нет';root.append(empty);return}
list.forEach((a,i)=>{const card=document.createElement('article');card.className='card';const top=document.createElement('div');top.className='cardtop';const ico=document.createElement('div');ico.className='gameicon';ico.textContent='🎮';const info=document.createElement('div');info.style.minWidth='0';const game=document.createElement('div');game.className='game';game.textContent=a.game||'Без названия';const sub=document.createElement('div');sub.className='sub';sub.textContent='Аккаунт #'+(i+1);info.append(game,sub);top.append(ico,info);const actions=document.createElement('div');actions.className='actions';const login=document.createElement('button');login.className='copy';login.textContent='👤 Скопировать логин';login.addEventListener('click',()=>copyText(a.login,'Логин'));const pass=document.createElement('button');pass.className='copy pass';pass.textContent='🔑 Скопировать пароль';pass.addEventListener('click',()=>copyText(a.password,'Пароль'));actions.append(login,pass);card.append(top,actions);root.append(card)})}
function filter(){const q=$('search').value.trim().toLocaleLowerCase('ru');render(all.filter(a=>(a.game||'').toLocaleLowerCase('ru').includes(q)))}
async function load(){const root=$('cards');root.innerHTML='<div class="state"><div class="spinner"></div>Загружаем аккаунты…</div>';try{const initData=tg?.initData||'';const res=await fetch('/api/miniapp/accounts',{headers:{'X-Telegram-Init-Data':initData}});const data=await res.json();if(!res.ok||!data.ok)throw Error(data.error||'Ошибка загрузки');all=data.accounts||[];$('total').textContent=all.length;filter()}catch(e){root.replaceChildren();const err=document.createElement('div');err.className='state';err.textContent=e.message||'Не удалось загрузить каталог. Открой Mini App через Telegram.';root.append(err);$('caption').textContent='Нет соединения'}}
$('search').addEventListener('input',filter);$('refresh').addEventListener('click',load);load();
</script></body></html>
