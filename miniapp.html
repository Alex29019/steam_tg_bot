<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050713">
<title>Orbit — каталог аккаунтов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#050713;--panel:rgba(13,19,43,.78);--panel2:rgba(20,27,57,.8);--line:rgba(157,174,255,.15);--text:#f2f4ff;--muted:#9ba7ca;--blue:#8db7ff;--violet:#b39aff;--cyan:#7ce8ff;--green:#8ef0cf}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 16% 5%,rgba(79,62,170,.26),transparent 36%),radial-gradient(ellipse at 92% 28%,rgba(34,105,169,.2),transparent 38%),radial-gradient(ellipse at 50% 100%,rgba(84,47,154,.19),transparent 42%),#050713;color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#space{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.9}.nebula{position:fixed;inset:-20%;pointer-events:none;z-index:0;filter:blur(65px);opacity:.3;background:conic-gradient(from 30deg at 25% 35%,transparent 0 20%,rgba(76,91,210,.28),transparent 38% 58%,rgba(28,160,201,.17),transparent 75%);animation:nebulaDrift 30s ease-in-out infinite alternate}.aurora{position:fixed;z-index:0;pointer-events:none;left:-25%;top:15%;width:150%;height:34%;background:linear-gradient(100deg,transparent,rgba(73,93,201,.08),rgba(71,203,225,.07),transparent);filter:blur(40px);transform:rotate(-12deg);animation:aurora 17s ease-in-out infinite alternate}@keyframes nebulaDrift{to{transform:translate(5%,4%) rotate(18deg) scale(1.08)}}@keyframes aurora{to{transform:translateY(45px) rotate(-7deg);opacity:.7}}
.wrap{position:relative;z-index:1;width:min(100%,820px);margin:auto;padding:calc(19px + env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom))}
.topline{display:flex;align-items:center;justify-content:space-between;margin:0 3px 15px}.brand{display:flex;align-items:center;gap:9px;color:#dce5ff;font-size:11px;font-weight:850;letter-spacing:2.3px}.brandmark{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(126,154,255,.24),rgba(147,108,255,.16));border:1px solid rgba(172,184,255,.26);box-shadow:0 0 24px rgba(112,125,255,.2)}.live{display:flex;align-items:center;gap:7px;color:#9ba9cc;font-size:10px;letter-spacing:1px;text-transform:uppercase}.live:before{content:"";width:6px;height:6px;border-radius:50%;background:#7ce8bd;box-shadow:0 0 12px #7ce8bd;animation:pulse 1.8s infinite}@keyframes pulse{50%{opacity:.45;box-shadow:0 0 3px #7ce8bd}}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:25px 21px 20px;border:1px solid rgba(159,174,255,.2);border-radius:26px;background:linear-gradient(125deg,rgba(20,27,62,.88),rgba(10,16,37,.82) 60%,rgba(29,23,66,.76));box-shadow:0 22px 70px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(18px);animation:rise .7s both}.hero:before{content:"";position:absolute;z-index:-1;width:220px;height:220px;right:-65px;top:-120px;border-radius:50%;background:rgba(102,121,255,.28);filter:blur(45px)}.hero:after{content:"";position:absolute;z-index:-1;width:150px;height:150px;right:14%;bottom:-130px;border-radius:50%;background:rgba(74,214,239,.15);filter:blur(35px)}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.kicker{display:flex;align-items:center;gap:7px;color:#a9baff;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.hero h1{font-size:clamp(27px,7vw,37px);line-height:1.08;letter-spacing:-1.1px;margin:12px 0 9px;font-weight:850}.hero h1 span{background:linear-gradient(95deg,#fff 8%,#b8caff 48%,#c7aaff 90%);background-clip:text;-webkit-background-clip:text;color:transparent}.hero p{max-width:440px;margin:0;color:#aab6d7;font-size:13px;line-height:1.55}.stats{display:flex;gap:9px;margin-top:20px}.stat{min-width:118px;padding:10px 13px;border:1px solid rgba(159,174,255,.15);border-radius:14px;background:rgba(4,8,25,.36);backdrop-filter:blur(10px)}.stat b{display:block;color:#f3f5ff;font-size:21px;line-height:1.1;letter-spacing:-.5px}.stat span{display:block;margin-top:4px;color:#9aa8cb;font-size:10px;letter-spacing:.4px}
.searchbox{display:flex;align-items:center;gap:11px;margin:18px 0 12px;padding:0 15px;height:56px;border:1px solid rgba(155,174,255,.19);border-radius:17px;background:rgba(13,19,43,.76);box-shadow:0 12px 30px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(16px);transition:border-color .2s,box-shadow .2s}.searchbox:focus-within{border-color:rgba(137,174,255,.55);box-shadow:0 0 0 3px rgba(111,143,255,.1),0 12px 30px rgba(0,0,0,.18)}.searchbox svg{width:19px;height:19px;flex:0 0 auto;color:#91a9e6}.searchbox input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:14px}.searchbox input::placeholder{color:#7784a9}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 3px 13px;color:#98a5c8;font-size:11px}.toolbar-left{display:flex;align-items:center;gap:8px}.toolbar-left:before{content:"";width:5px;height:5px;border-radius:50%;background:#8faaff;box-shadow:0 0 9px #8faaff}.refresh{display:flex;align-items:center;gap:7px;border:1px solid rgba(146,166,255,.18);border-radius:11px;background:rgba(24,32,66,.55);color:#c3d0ff;padding:8px 11px;font-size:11px;font-weight:750;cursor:pointer;transition:.2s}.refresh svg{width:14px;height:14px}.refresh:active{transform:scale(.96)}.refresh.busy svg{animation:spin .8s linear infinite}
.grid{display:grid;grid-template-columns:1fr;gap:11px}.card{position:relative;overflow:hidden;min-width:0;padding:15px;border:1px solid rgba(151,169,255,.15);border-radius:19px;background:linear-gradient(135deg,rgba(19,27,57,.88),rgba(10,16,36,.88));box-shadow:0 13px 32px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(14px);animation:cardIn .45s both;transition:transform .22s,border-color .22s,box-shadow .22s}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:linear-gradient(180deg,transparent,#8d9fff, #8ce8ff,transparent);opacity:.65}.card:after{content:"";position:absolute;width:100px;height:100px;right:-65px;top:-65px;border-radius:50%;background:rgba(112,133,255,.13);filter:blur(24px);pointer-events:none}.card:active{transform:scale(.992);border-color:rgba(154,177,255,.32)}@keyframes cardIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.cardtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}.gameicon{width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;border-radius:14px;border:1px solid rgba(155,174,255,.2);background:linear-gradient(145deg,rgba(99,132,255,.2),rgba(141,104,255,.13));box-shadow:inset 0 1px rgba(255,255,255,.06),0 0 23px rgba(98,113,255,.09);color:#b9caff}.gameicon svg{width:21px;height:21px}.info{min-width:0;flex:1}.game{font-size:14px;font-weight:780;line-height:1.3;overflow-wrap:anywhere;color:#f1f3ff}.sub{display:flex;align-items:center;gap:6px;margin-top:5px;color:#8997bb;font-size:10px}.sub svg{width:12px;height:12px;color:#9caeff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.copy{display:flex;align-items:center;justify-content:center;gap:8px;min-height:43px;padding:9px 8px;border:1px solid rgba(121,160,255,.24);border-radius:12px;background:linear-gradient(135deg,rgba(74,111,203,.19),rgba(54,80,151,.13));color:#e0eaff;font-size:11px;font-weight:750;cursor:pointer;transition:transform .18s,border-color .18s,background .18s;white-space:nowrap}.copy svg{width:15px;height:15px;flex:0 0 auto;color:#a9c7ff}.copy.pass{border-color:rgba(172,143,255,.25);background:linear-gradient(135deg,rgba(127,88,202,.2),rgba(75,57,139,.14))}.copy.pass svg{color:#c4aaff}.copy:active{transform:scale(.97);background:rgba(111,135,225,.28)}
.state{padding:36px 17px;text-align:center;color:#9ba8ca;border:1px dashed rgba(147,165,255,.2);border-radius:18px;background:rgba(13,19,43,.48);backdrop-filter:blur(12px);font-size:12px}.spinner{width:27px;height:27px;border:2px solid rgba(139,160,255,.17);border-top-color:#a9baff;border-right-color:#8ceaff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;z-index:10;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;max-width:calc(100% - 30px);padding:12px 17px;border:1px solid rgba(181,200,255,.35);border-radius:30px;background:rgba(227,237,255,.96);color:#10172d;font-size:12px;font-weight:800;box-shadow:0 12px 40px #0008;opacity:0;transform:translate(-50%,18px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast svg{width:15px;height:15px}.foot{display:flex;justify-content:center;align-items:center;gap:7px;padding:21px 0 3px;color:#657394;font-size:10px}.foot svg{width:13px;height:13px;color:#8298d7}
@media(min-width:590px){.grid{grid-template-columns:1fr 1fr}.hero{padding:30px 27px 23px}.hero h1{font-size:37px}.wrap{padding-left:22px;padding-right:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas><div class="nebula"></div><div class="aurora"></div>
<main class="wrap">
  <div class="topline"><div class="brand"><span class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2.8 14.3 9.7 21.2 12l-6.9 2.3L12 21.2l-2.3-6.9L2.8 12l6.9-2.3L12 2.8Z"/><path d="m19 2 .7 2.3L22 5l-2.3.7L19 8l-.7-2.3L16 5l2.3-.7L19 2Z"/></svg></span>ORBIT / ACCOUNT HUB</div><div class="live">Система активна</div></div>
  <section class="hero">
    <div class="kicker"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3c2.5 2.5 3.5 5.5 3.5 9S14.5 18.5 12 21M3 12h18"/></svg> GALACTIC DATABASE</div>
    <h1><span>Каталог аккаунтов</span></h1>
    <p>Исследуй каталог, находи нужную игру и копируй данные аккаунта в одно касание.</p>
    <div class="stats"><div class="stat"><b id="total">—</b><span>ВСЕГО АККАУНТОВ</span></div><div class="stat"><b id="shown">—</b><span>НАЙДЕНО</span></div></div>
  </section>
  <label class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Найти игру в галактике…" autocomplete="off" spellcheck="false"></label>
  <div class="toolbar"><div class="toolbar-left" id="caption">Загрузка каталога…</div><button class="refresh" id="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"/></svg>Обновить</button></div>
  <section id="cards" class="grid"><div class="state"><div class="spinner"></div>Синхронизация с базой…</div></section>
  <div class="foot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg>Защищённое соединение Telegram</div>
</main>
<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg><span id="toastText">Скопировано</span></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
if(tg?.setHeaderColor)tg.setHeaderColor('#050713');if(tg?.setBackgroundColor)tg.setBackgroundColor('#050713');
const $=id=>document.getElementById(id);let all=[];let toastTimer;
function toast(msg){$('toastText').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1700)}
async function copyText(value,label){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value)}else{const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copy failed')}toast(label+' скопирован')}catch(e){toast('Не удалось скопировать')}}
const iconGame='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8h11a4 4 0 0 1 3.8 5.2l-1 3.2a2.2 2.2 0 0 1-3.6 1l-2.2-2H9.5l-2.2 2a2.2 2.2 0 0 1-3.6-1l-1-3.2A4 4 0 0 1 6.5 8Z"/><path d="M8 10.5v4M6 12.5h4M16 11.5h.01M18 14h.01"/></svg>';
const iconUser='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-3.4 3.1-5.2 7-5.2s6.4 1.8 7 5.2"/></svg>';
const iconKey='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8 2 2-2 2 2 2-3 3-2-2-3 3"/></svg>';
const iconCopy='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"/></svg>';
function render(list){$('shown').textContent=list.length;$('caption').textContent=list.length?'Доступные аккаунты':'Ничего не найдено';const root=$('cards');root.replaceChildren();if(!list.length){const empty=document.createElement('div');empty.className='state';empty.textContent='В этой области космоса аккаунтов не найдено';root.append(empty);return}
list.forEach((a,i)=>{const card=document.createElement('article');card.className='card';card.style.animationDelay=Math.min(i%12,11)*35+'ms';const top=document.createElement('div');top.className='cardtop';const ico=document.createElement('div');ico.className='gameicon';ico.innerHTML=iconGame;const info=document.createElement('div');info.className='info';const game=document.createElement('div');game.className='game';game.textContent=a.game||'Без названия';const sub=document.createElement('div');sub.className='sub';sub.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';sub.append(document.createTextNode('Запись каталога №'+(i+1)));info.append(game,sub);top.append(ico,info);const actions=document.createElement('div');actions.className='actions';const login=document.createElement('button');login.className='copy';login.innerHTML=iconUser+iconCopy+'<span>Скопировать логин</span>';login.addEventListener('click',()=>copyText(a.login,'Логин'));const pass=document.createElement('button');pass.className='copy pass';pass.innerHTML=iconKey+iconCopy+'<span>Скопировать пароль</span>';pass.addEventListener('click',()=>copyText(a.password,'Пароль'));actions.append(login,pass);card.append(top,actions);root.append(card)})}
function filter(){const q=$('search').value.trim().toLocaleLowerCase('ru');render(all.filter(a=>(a.game||'').toLocaleLowerCase('ru').includes(q)))}
async function load(){const root=$('cards');$('refresh').classList.add('busy');root.innerHTML='<div class="state"><div class="spinner"></div>Синхронизация с базой…</div>';try{const initData=tg?.initData||'';const res=await fetch('/api/miniapp/accounts',{headers:{'X-Telegram-Init-Data':initData}});const data=await res.json();if(!res.ok||!data.ok)throw Error(data.error||'Ошибка загрузки');all=data.accounts||[];$('total').textContent=all.length;filter()}catch(e){root.replaceChildren();const err=document.createElement('div');err.className='state';err.textContent=e.message||'Не удалось загрузить каталог. Открой Mini App через Telegram.';root.append(err);$('caption').textContent='Нет соединения'}finally{$('refresh').classList.remove('busy')}}
$('search').addEventListener('input',filter);$('refresh').addEventListener('click',load);load();
// Lightweight animated starfield. Respects reduced-motion preference.
(()=>{const canvas=$('space'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,stars=[],shooters=[],raf;const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;function resize(){dpr=Math.min(window.devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(170,Math.floor(w*h/6500))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.25+.2,a:Math.random()*.65+.2,p:Math.random()*6.28,s:Math.random()*.012+.003}));}function frame(){ctx.clearRect(0,0,w,h);for(const s of stars){s.p+=s.s;const alpha=s.a*(.72+.28*Math.sin(s.p));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(205,220,255,'+alpha+')';ctx.fill()}if(!reduce&&Math.random()<.008&&shooters.length<2)shooters.push({x:Math.random()*w*.8,y:Math.random()*h*.45,v:5+Math.random()*5,l:55+Math.random()*60,a:1});shooters=shooters.filter(s=>s.a>.04);for(const s of shooters){ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.l,s.y-s.l*.38);const g=ctx.createLinearGradient(s.x,s.y,s.x-s.l,s.y-s.l*.38);g.addColorStop(0,'rgba(220,235,255,.9)');g.addColorStop(1,'rgba(135,159,255,0)');ctx.strokeStyle=g;ctx.lineWidth=1.4;ctx.stroke();s.x+=s.v;s.y+=s.v*.38;s.a-=.012}if(!reduce)raf=requestAnimationFrame(frame)}resize();frame();window.addEventListener('resize',resize,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else if(!reduce)frame()})})();
</script>
</body></html>
